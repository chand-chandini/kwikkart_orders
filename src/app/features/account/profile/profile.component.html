<div class="container py-4">
  <!-- Reduced max-width for a more compact look -->
  <div class="premium-card mx-auto" style="max-width: 420px;">
    
    <!-- Header / Avatar Section -->
    <div class="card-header-custom">
      <div class="avatar-circle">
        <span class="initials">FD</span>
      </div>
      <h4 class="fw-bold mb-1">My Profile</h4>
      <p class="text-muted small mb-0">Manage your personal information</p>
    </div>

    <!-- Form Section -->
    <form (ngSubmit)="save()" class="px-4 pb-4 pt-1">
      
      <!-- Mobile Number (Read-only) -->
      <div class="form-group-custom mb-3">
        <label class="form-label-custom">Mobile number</label>
        <div class="input-group-custom readonly-group">
          <i class="bi bi-phone input-icon"></i>
          <input class="form-control-custom" [value]="mobile" disabled />
        </div>
        <div class="helper-text">Mobile number cannot be changed</div>
      </div>

      <!-- Full Name -->
      <div class="form-group-custom mb-3">
        <label class="form-label-custom" for="name">Full name</label>
        <div class="input-group-custom">
          <i class="bi bi-person input-icon"></i>
          <input id="name" class="form-control-custom" [(ngModel)]="name" name="name" required placeholder="Enter your full name" />
        </div>
      </div>

      <!-- Email -->
      <div class="form-group-custom mb-4">
        <label class="form-label-custom" for="email">Email address</label>
        <div class="input-group-custom">
          <i class="bi bi-envelope input-icon"></i>
          <input id="email" class="form-control-custom" type="email" [(ngModel)]="email" name="email" placeholder="you@example.com" />
        </div>
      </div>

      <!-- Action Button -->
      <div class="d-flex justify-content-end mt-2">
        <button class="btn-premium" type="submit" [disabled]="saving">
          @if (saving) {
            <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
          }
          Save changes
        </button>
      </div>
    </form>
  </div>
</div>
