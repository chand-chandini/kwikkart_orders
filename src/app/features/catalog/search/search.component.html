<div class="container py-4">
  <form class="d-flex gap-2 mb-4" style="max-width: 480px;" (ngSubmit)="submitSearch()">
    <input class="form-control" placeholder="Search for products..." [(ngModel)]="query" name="q" />
    <button class="btn btn-brand" type="submit">Search</button>
  </form>

  @if (loading) {
    <app-spinner label="Searching..." />
  } @else if (products.length) {
    <div class="small text-muted mb-3">{{ products.length }} results for "{{ query }}"</div>
    <div class="row g-3">
      @for (product of products; track product.id) {
        <div class="col-6 col-sm-4 col-md-3 col-lg-2">
          <app-product-card [product]="product" [orgCode]="orgCode" [orgId]="product.org_id" />
        </div>
      }
    </div>
  } @else {
    <app-empty-state icon="🔍" title="No results" [message]="'Nothing matched \'' + query + '\'.'" />
  }
</div>
