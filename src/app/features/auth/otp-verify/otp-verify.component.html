<app-auth-card title="Verify OTP" [subtitle]="'Enter the code sent to +91 ' + mobile">
  <form (ngSubmit)="submit()">
    <label class="form-label" for="otp">OTP</label>
    <input
      id="otp"
      class="form-control mb-2 text-center auth-otp-input"
      type="text"
      inputmode="numeric"
      maxlength="4"
      placeholder="• • • •"
      [(ngModel)]="otp"
      name="otp"
      required
    />
    @if (errorMessage) {
      <div class="text-danger small mb-2">{{ errorMessage }}</div>
    }
    <button class="btn btn-brand w-100 mt-3 py-2" type="submit" [disabled]="submitting">
      @if (submitting) {
        <span class="spinner-border spinner-border-sm me-2"></span>
      }
      Verify &amp; continue
    </button>
    <button class="btn btn-link w-100 mt-1" type="button" (click)="resend()">Resend OTP</button>
  </form>
</app-auth-card>
