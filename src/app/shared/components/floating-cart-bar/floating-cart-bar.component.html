@if (visible()) {
  <a class="floating-cart-bar" [routerLink]="['/o', orgCode, 'cart']">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="9" cy="20" r="1.4" fill="currentColor" stroke="none" />
      <circle cx="18" cy="20" r="1.4" fill="currentColor" stroke="none" />
      <path d="M2.5 3h2l2.4 12.2a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.6L21 7H6" />
    </svg>
    <span class="floating-cart-bar__count">{{ cartService.itemCount() }} {{ cartService.itemCount() === 1 ? 'Item' : 'Items' }}</span>
    <span class="floating-cart-bar__divider"></span>
    <span class="floating-cart-bar__label">View Cart</span>
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m9 18 6-6-6-6" />
    </svg>
  </a>
}
